[package]
name = "perception"
version = "0.1.0"
edition = "2021"
description = "Simulated LiDAR, ground removal, clustering, tracking and path planning for the hero scene of menphim.github.io"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
